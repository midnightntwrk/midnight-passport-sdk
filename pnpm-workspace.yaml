packages:
  - packages/*

# Supply-chain posture, natively enforced (docs/development-workflow.md §4;
# flagged by org code scanning on the migration PR).
# The 7-day cooldown, applied at resolution time (minutes).
minimumReleaseAge: 10080
# No transitive dependencies from git/URL sources — registry only.
blockExoticSubdeps: true
# Updates may never weaken these settings.
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.4 || 10.34.5
  - pnpm@10.34.4 || 10.34.5
