packages:
  - packages/*

# Supply-chain posture, natively enforced (docs/development-workflow.md §4;
# flagged by org code scanning on the migration PR).
# The 7-day cooldown, applied at resolution time (minutes).
minimumReleaseAge: 10080
# No transitive dependencies from git/URL sources — registry only.
blockExoticSubdeps: true
# Updates may never weaken these settings.
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@10.34.4
  - pnpm@10.34.4
  # midnight-js 5.0.1 and its pins are younger than 7 days, but they fix error 138.
  # Remove these entries on 2026/11/25.
  - '@midnight-ntwrk/midnight-js@5.0.1'
  - '@midnight-ntwrk/midnight-js-contracts@5.0.1'
  - '@midnight-ntwrk/midnight-js-protocol@5.0.1'
  - '@midnight-ntwrk/midnight-js-types@5.0.1'
  - '@midnight-ntwrk/midnight-js-utils@5.0.1'
  - '@midnight-ntwrk/compact-js@3.0.2'
  - '@midnightntwrk/ledger-v9@1.0.2'
  - '@midnightntwrk/onchain-runtime-v4@4.0.2'
  - '@midnightntwrk/wallet-sdk-address-format@4.0.1'
